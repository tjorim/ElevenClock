[workspace]
members = ["crates/clock-core", "crates/clock-windows", "crates/clock-app", "crates/clock-overlay-spike"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.99"
version = "0.1.0"
publish = false
# Repository licensing/asset notices are retained; R14 resolves the existing conflict.
license-file = "../LICENSE"

[profile.release]
# Retain matching PDBs as separate development artifacts, never in the installer.
debug = "line-tables-only"
strip = "none"

[workspace.dependencies]
clock-core = { path = "crates/clock-core" }
clock-windows = { path = "crates/clock-windows" }
chrono = { version = "0.4.42", default-features = false, features = ["std"] }
windows = { version = "0.61.3", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_Storage_FileSystem", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging", "Win32_UI_Controls", "Win32_UI_HiDpi", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_UI_Accessibility", "Win32_System_Registry", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_Security", "Win32_UI_Input_KeyboardAndMouse", "Win32_Graphics_Direct2D", "Win32_Graphics_Direct2D_Common", "Win32_Graphics_DirectWrite", "Win32_Graphics_Dxgi_Common", "Win32_System_RemoteDesktop", "Win32_Security_Authorization", "Win32_System_ProcessStatus", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Memory", "Win32_System_Pipes", "Win32_System_Time", "Win32_System_SystemInformation", "Win32_System_Ole", "Win32_System_Variant", "Win32_System_DataExchange"] }
