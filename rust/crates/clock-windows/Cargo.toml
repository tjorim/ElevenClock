[package]
name = "clock-windows"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license-file.workspace = true

[features]
default = []
overlay-spike = []

[dependencies]
chrono.workspace = true
clock-core.workspace = true
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(windows)'.dependencies]
windows.workspace = true
# Vector2 for Direct2D drawing; already in the graph through `windows`.
windows-numerics = "0.2.0"

[dev-dependencies]
tempfile = "3.23"

# A custom main lets this target double as its own stand-in helper process.
[[test]]
name = "discovery_worker"
harness = false

# Same pattern: one executable plays runner, provider and UI Automation clients.
[[test]]
name = "uia_lifetime"
harness = false
