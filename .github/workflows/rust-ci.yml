name: Rust foundation
on:
  push:
    branches: [main, rust-rewrite]
    paths: ['rust/**', '.github/workflows/rust-ci.yml', 'docs/RUST_*.md', 'docs/windows-evidence/**', 'scripts/*rust*']
  pull_request:
    paths: ['rust/**', '.github/workflows/rust-ci.yml', 'docs/RUST_*.md', 'docs/windows-evidence/**', 'scripts/*rust*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        toolchain: ['1.90.0', stable]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy
      - run: cargo +${{ matrix.toolchain }} fmt --manifest-path rust/Cargo.toml --all --check
      - run: cargo +${{ matrix.toolchain }} clippy --manifest-path rust/Cargo.toml -p clock-core --all-targets --locked -- -D warnings
      - run: cargo +${{ matrix.toolchain }} test --manifest-path rust/Cargo.toml -p clock-core --locked
      - run: cargo +${{ matrix.toolchain }} test --manifest-path rust/Cargo.toml -p clock-core --doc --locked
      - run: cargo +${{ matrix.toolchain }} clippy --manifest-path rust/Cargo.toml -p clock-windows --all-targets --locked -- -D warnings
      - run: cargo +${{ matrix.toolchain }} test --manifest-path rust/Cargo.toml -p clock-windows --all-targets --locked
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      matrix:
        toolchain: ['1.90.0', stable]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy
          targets: x86_64-pc-windows-msvc
      - run: cargo +${{ matrix.toolchain }} fmt --manifest-path rust/Cargo.toml --all --check
      - run: cargo +${{ matrix.toolchain }} check --manifest-path rust/Cargo.toml --workspace --all-targets --locked
      - run: cargo +${{ matrix.toolchain }} clippy --manifest-path rust/Cargo.toml --workspace --all-targets --locked -- -D warnings
      # The MSRV leg only has to compile and lint on Windows; running the suite,
      # the release build and the desktop smoke checks once (stable) is enough.
      - if: matrix.toolchain == 'stable'
        run: cargo +${{ matrix.toolchain }} test --manifest-path rust/Cargo.toml --workspace --all-targets --locked
      - if: matrix.toolchain == 'stable'
        run: cargo +${{ matrix.toolchain }} test --manifest-path rust/Cargo.toml --workspace --doc --locked
      - if: matrix.toolchain == 'stable'
        run: cargo +${{ matrix.toolchain }} build --manifest-path rust/Cargo.toml -p clock-app --release --target x86_64-pc-windows-msvc --locked
      - name: Check GUI subsystem and linked native resources
        if: matrix.toolchain == 'stable'
        shell: pwsh
        run: |
          $exe = 'rust/target/x86_64-pc-windows-msvc/release/clock-app.exe'
          $bytes = [IO.File]::ReadAllBytes($exe)
          $pe = [BitConverter]::ToInt32($bytes, 0x3c)
          if ([BitConverter]::ToUInt16($bytes, $pe + 0x5c) -ne 2) { throw 'Expected Windows GUI subsystem' }
          $sdk = Get-ChildItem 'C:/Program Files (x86)/Windows Kits/10/bin/*/x64/mt.exe' | Sort-Object FullName -Descending | Select-Object -First 1
          if (!$sdk) { throw 'Windows SDK manifest tool unavailable' }
          & $sdk.FullName "-inputresource:$exe;#1" '-out:app.manifest'
          if ($LASTEXITCODE -ne 0) { throw 'Missing embedded manifest' }
          if (!(Select-String -Path app.manifest -Pattern 'PerMonitorV2' -Quiet)) { throw 'Missing DPI-v2 manifest' }
          # Dialog and icon resources must be present in the PE resource table.
          $utf16 = [Text.Encoding]::Unicode.GetString($bytes)
          if (!$utf16.Contains('ElevenClock Settings')) { throw 'Missing Settings dialog resource' }
      - name: Native dialog launch, focus, capture and close smoke check
        if: matrix.toolchain == 'stable'
        shell: pwsh
        run: ./scripts/test-rust-settings.ps1
      - name: High contrast, keyboard and real display-scaling feasibility
        if: matrix.toolchain == 'stable'
        shell: powershell
        run: ./scripts/test-rust-ui-environment.ps1
      - uses: actions/upload-artifact@v4
        if: always() && matrix.toolchain == 'stable'
        with:
          # Evidence only (Settings/UI smoke captures). The placeholder app binary is
          # deliberately not published; releases come from R14.
          name: windows-ui-evidence
          retention-days: 14
          path: native-evidence/
          if-no-files-found: error
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-audit --locked --version 0.22.2
      - name: Advisory audit (failures are never ignored)
        working-directory: rust
        run: cargo audit --deny warnings
      # Gates every PR. The inventory is regenerated on demand (see
      # docs/RUST_DEPENDENCIES.md); it is not uploaded as an artifact.
      - name: License inventory and original-notice check
        run: |
          python3 scripts/test-rust-license-check.py
          cargo metadata --manifest-path rust/Cargo.toml --locked --format-version 1 > dependency-metadata.json
          python3 scripts/rust-license-check.py dependency-metadata.json > /dev/null
