name: R02 hosted desktop evidence
on:
  pull_request:
    paths: ['rust/crates/clock-windows/**', 'scripts/test-rust-taskbar.ps1', '.github/workflows/taskbar-probe.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
          - runner: windows-11-arm
            target: x86_64-pc-windows-msvc
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build the development probe
        run: cargo +stable build --manifest-path rust/Cargo.toml -p clock-windows --example taskbar_probe --target ${{ matrix.target }} --locked
      - name: Actual shell discovery, screenshots, restart and helper lifetime
        shell: pwsh
        run: ./scripts/test-rust-taskbar.ps1 -RestartExplorer -PrepareHostedDesktop -ProbeTarget '${{ matrix.target }}' -Executable 'rust/target/${{ matrix.target }}/debug/examples/taskbar_probe.exe'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r02-desktop-${{ matrix.runner }}-${{ matrix.target }}
          path: native-evidence/r02/
          if-no-files-found: error
